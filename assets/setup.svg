<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12071f"/>
      <stop offset="1" stop-color="#2a1040"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a227"/>
      <stop offset="0.5" stop-color="#7a3fa0"/>
      <stop offset="1" stop-color="#c9a227"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b6b"><animate attributeName="stop-color" values="#ff3b6b;#c9a227;#3bd1ff;#a04bff;#ff3b6b" dur="4s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#3bd1ff"><animate attributeName="stop-color" values="#3bd1ff;#a04bff;#ff3b6b;#c9a227;#3bd1ff" dur="4s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif}
      .title{font-size:24px;font-weight:700;fill:#f5e6b8;letter-spacing:4px}
      .lbl{font-size:12px;font-weight:700;fill:#c9a227;letter-spacing:2px}
      .sm{font-size:14.5px}
      .val{font-size:17px;font-weight:600;fill:#e8dcc0}
      .row{opacity:0;animation:in .6s ease forwards}
      @keyframes in{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
      .r1{animation-delay:.2s}.r2{animation-delay:.4s}.r3{animation-delay:.6s}
      .r4{animation-delay:.8s}.r5{animation-delay:1s}.r6{animation-delay:1.2s}
      .pulse{animation:p 2s ease-in-out infinite}
      @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
      .fan{transform-origin:center;transform-box:fill-box;animation:spin 1.6s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </defs>

  <rect x="3" y="3" width="814" height="394" rx="22" fill="url(#bg)" stroke="url(#border)" stroke-width="3"/>

  <!-- en-tête -->
  <g class="t">
    <circle cx="44" cy="46" r="6" fill="#c9a227" class="pulse" filter="url(#glow)"/>
    <text x="62" y="54" class="title">MON SETUP</text>
    <text x="790" y="54" text-anchor="end" font-size="12" fill="#a89c80" letter-spacing="2">// SYSTEM ONLINE</text>
  </g>
  <rect x="32" y="74" width="756" height="3" rx="1.5" fill="url(#rgb)"/>

  <!-- composants -->
  <g class="t">
    <g class="row r1"><rect x="32" y="96" width="370" height="76" rx="12" fill="#ffffff08" stroke="#c9a22733"/>
      <text x="52" y="124" class="lbl">CPU</text><text x="52" y="152" class="val">AMD Ryzen 9 5900X</text></g>
    <g class="row r2"><rect x="418" y="96" width="370" height="76" rx="12" fill="#ffffff08" stroke="#c9a22733"/>
      <text x="438" y="124" class="lbl">GPU</text><text x="438" y="152" class="val">NVIDIA RTX 4060 Ti OC</text></g>

    <g class="row r3"><rect x="32" y="184" width="370" height="76" rx="12" fill="#ffffff08" stroke="#c9a22733"/>
      <text x="52" y="212" class="lbl">CARTE MÈRE</text><text x="52" y="240" class="val sm">ASUS TUF Gaming B550-Plus WiFi II</text></g>
    <g class="row r4"><rect x="418" y="184" width="370" height="76" rx="12" fill="#ffffff08" stroke="#c9a22733"/>
      <text x="438" y="212" class="lbl">MÉMOIRE</text><text x="438" y="240" class="val sm">32 Go DDR4 3200 MHz G.Skill Trident Z RGB</text></g>

    <g class="row r5"><rect x="32" y="272" width="370" height="76" rx="12" fill="#ffffff08" stroke="#c9a22733"/>
      <text x="52" y="300" class="lbl">REFROIDISSEMENT</text><text x="52" y="328" class="val sm">Cooler Master MasterLiquid 360L Core ARGB</text>
      </g>
    <g class="row r6"><rect x="418" y="272" width="370" height="76" rx="12" fill="#ffffff08" stroke="#c9a22733"/>
      <text x="438" y="300" class="lbl">BOÎTIER</text><text x="438" y="328" class="val">Cooler Master SL600M</text>
      <g transform="translate(758 310)"><g class="fan">
        <circle r="13" fill="none" stroke="url(#rgb)" stroke-width="2"/>
        <path d="M0-10Q6-6 0 0Q-6-6 0-10ZM10 0Q6 6 0 0Q6-6 10 0ZM0 10Q-6 6 0 0Q6 6 0 10ZM-10 0Q-6-6 0 0Q-6 6-10 0Z" fill="#c9a227"/>
      </g></g></g>
  </g>

  <rect x="32" y="364" width="756" height="3" rx="1.5" fill="url(#rgb)" class="pulse"/>
</svg>
